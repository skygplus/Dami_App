<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nigeria 2027: Seven Reasons to Unseat APC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">N</span>
          <span>Vote for Renewal 2027</span>
        </div>
        <button class="ghost-button">Nigeria Deserves Better</button>
      </header>

      <main class="hero">
        <section class="headline-block">
          <p class="eyebrow">NIGERIA 2027 ELECTION</p>
          <h1>Seven reasons to unseat APC</h1>
          <p class="intro">
            Nigeria needs leadership that listens, delivers, and protects the future of every citizen.
            The 2027 election is a chance to demand accountability, justice, and national renewal.
          </p>

          <div class="cta-row">
            <button id="prevBtn" class="secondary-button">Previous</button>
            <button id="nextBtn" class="primary-button">Next Step</button>
          </div>
        </section>

        <section class="step-panel" aria-live="polite">
          <div class="progress-wrap">
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressLabel" class="progress-label">1 of 7</span>
          </div>

          <div id="stepCard" class="step-card"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
